<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs><rect width="1500" height="1330" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033;font-size:17px}.node{fill:#fff;stroke:#334155;stroke-width:2}.edge{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.label{font-size:15px;font-weight:bold}</style><text x="750" y="35" text-anchor="middle" style="font-size:25px;font-weight:bold">PawFit — General Admin / Seller Flow (COD)</text>
