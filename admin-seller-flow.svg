<text x="60" y="1210" style="font-size:16px">Fulfillment statuses: Pending → Confirmed → Processing → Shipped → Delivered.</text><text x="60" y="1242" style="font-size:16px">Update status as fulfillment progresses. Record COD as paid only after collection is confirmed.</text><text x="60" y="1274" style="font-size:16px">Matching A / B circles connect the flow. Cancellation review requests and refund workflows are future additions.</text></svg>

